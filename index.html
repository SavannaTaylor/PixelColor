<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | creative coding</title>
  </head>

 <body style="text-align: center; padding: 90px 0 0 0; border: 0; margin: 0; background: #383838;">

    <canvas
      id="unity-canvas"
      width="760"
      height="940"
      tabindex="-1"
      style="width: 485px; height: 600px; background: #383838;">
    </canvas>

    <script src="Build/PixelStudio.loader.js"></script>

    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, initial-scale=1.0';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");

        canvas.style.width = "90vw";
        canvas.style.height = "auto";
        canvas.style.maxWidth = "485px";
        canvas.style.position = "relative";
        canvas.style.display = "block";
        canvas.style.margin = "20px auto";

        document.body.style.textAlign = "center";
        document.body.style.margin = "0";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/PixelStudio.data.unityweb",
        frameworkUrl: "Build/PixelStudio.framework.js.unityweb",
        codeUrl: "Build/PixelStudio.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "creative coding",
        productVersion: "0.1.0",
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>

  </body>
</html>
